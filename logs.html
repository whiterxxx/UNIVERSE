<script>
'use strict';
// birthdayNovelURL は元小説へのリンク
const LOG_CONFIG=JSON.parse(document.querySelector('#log-data').textContent);
const record=document.querySelector('#record'),rows=document.querySelector('#log-rows'),entryButtons=new Map();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const typingTargets=[],skip=document.querySelector('#skip-replay'),typingStatus=document.querySelector('#typing-status');
const TYPE_SPEED={character:26,linePause:230,recordPause:430};
let activeIndex=-1,activeButton=null,typingIndex=0,typingOffset=0,typingTimer=null,replayDone=false,replayPaused=false;
function safeExternalURL(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:null;}catch{return null;}}
document.querySelector('#archive-date').textContent=LOG_CONFIG.date;
document.querySelector('#log-heading').textContent=LOG_CONFIG.day+' — ACTIVITY LOG';
document.querySelector('#entry-count').textContent=LOG_CONFIG.entries.length+' RECORDS';
const relatedURL=safeExternalURL(LOG_CONFIG.birthdayNovelURL);
if(relatedURL){const a=document.querySelector('#related-novel');a.href=relatedURL;a.target='_blank';a.rel='noopener noreferrer';a.hidden=false;}
function stopTypingTimer(){if(typingTimer!==null){clearTimeout(typingTimer);typingTimer=null;}}
function finishReplay(){
 stopTypingTimer();replayDone=true;
 for(const target of typingTargets){if(target.row)target.row.hidden=false;target.element.textContent=target.text;target.element.classList.remove('typing-active');}
 skip.disabled=true;typingStatus.textContent='ARCHIVE READY / '+LOG_CONFIG.entries.length+' RECORDS';
}
function tickReplay(){
 typingTimer=null;if(replayDone||replayPaused)return;
 if(typingIndex>=typingTargets.length){finishReplay();return;}
 const target=typingTargets[typingIndex];if(target.row)target.row.hidden=false;target.element.classList.add('typing-active');
 typingOffset=Math.min(typingOffset+1,target.text.length);target.element.textContent=target.text.slice(0,typingOffset);
 let delay=TYPE_SPEED.character+[0,5,-3,8][typingOffset%4];
 const character=target.text.charAt(typingOffset-1);
 if(character==='\n')delay=140;else if(/[.,:;!?]/.test(character))delay+=65;
 if(typingOffset>=target.text.length){
  target.element.classList.remove('typing-active');
  delay=target.text.startsWith('LOCAL |')?TYPE_SPEED.recordPause:TYPE_SPEED.linePause;
  typingIndex++;typingOffset=0;
 }
 typingTimer=setTimeout(tickReplay,delay);
}
function pauseReplay(){replayPaused=true;stopTypingTimer();}
function resumeReplay(){replayPaused=false;if(!replayDone&&typingTimer===null)typingTimer=setTimeout(tickReplay,TYPE_SPEED.character);}
function releaseRecord(){
 document.body.classList.remove('modal-open');
 if(activeButton){activeButton.setAttribute('aria-pressed','false');activeButton.focus({preventScroll:true});}
 resumeReplay();
}
function openRecord(index,updateHistory){
 const entry=LOG_CONFIG.entries[index];if(!entry)return;
 if(activeButton)activeButton.setAttribute('aria-pressed','false');
 activeIndex=index;activeButton=entryButtons.get(entry.id);activeButton.setAttribute('aria-pressed','true');
 document.querySelector('#record-file').textContent=entry.id+'.txt';
 document.querySelector('#record-window-name').textContent=entry.id+'.txt / L';
 document.querySelector('#record-time').textContent=LOG_CONFIG.date+' / '+entry.time;
 document.querySelector('#record-title').textContent=entry.title;
 document.querySelector('#record-count').textContent=String(index+1).padStart(2,'0')+' / '+String(LOG_CONFIG.entries.length).padStart(2,'0');
 const body=document.querySelector('#record-body');body.replaceChildren();
 for(const paragraph of entry.body.split(/\n\s*\n/)){const p=document.createElement('p');p.textContent=paragraph;body.append(p);}
 const previous=document.querySelector('#previous-record'),next=document.querySelector('#next-record');
 previous.disabled=index===0;next.disabled=index===LOG_CONFIG.entries.length-1;
 previous.textContent=index===0?'最初の記録':'← '+LOG_CONFIG.entries[index-1].time;
 next.textContent=next.disabled?'最後の記録':LOG_CONFIG.entries[index+1].time+' →';
 document.querySelector('#end-note').hidden=!next.disabled;
 pauseReplay();document.body.classList.add('modal-open');
 if(!record.open)record.showModal();
 document.querySelector('#record-scroll').scrollTop=0;
 document.querySelector('#record-close').focus({preventScroll:true});
 if(updateHistory)history.pushState(null,'','#'+entry.id);
}
function closeRecord(updateHistory){
 if(updateHistory&&location.hash)history.pushState(null,'',location.pathname+location.search);
 if(record.open)record.close();else releaseRecord();
}
typingTargets.push({element:document.querySelector('#boot-text'),text:'Opening local archive...\n31 OCT 2026 / TEMPORARY L SESSION\nReplaying case and local activity...'});
for(let index=0;index<LOG_CONFIG.entries.length;index++){
 const entry=LOG_CONFIG.entries[index],row=document.createElement('div');row.className='log-row';row.hidden=true;
 const button=document.createElement('button');button.className='time';button.type='button';
 const time=document.createElement('span');time.textContent=entry.time;button.append(time);
 button.setAttribute('aria-label',entry.time+'の小説ウィンドウを開く');button.setAttribute('aria-pressed','false');button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-controls','record');button.addEventListener('click',function(){openRecord(index,true);});
 const summary=document.createElement('div');summary.className='summary';
 for(const text of entry.eventLines){
  const line=document.createElement('div');line.className='log-line';
  const ghost=document.createElement('span');ghost.className='layout-text';ghost.textContent=text;ghost.setAttribute('aria-hidden','true');
  const typed=document.createElement('span');typed.className='typed-line';typed.setAttribute('aria-hidden','true');
  const accessible=document.createElement('span');accessible.className='sr-only';accessible.textContent=text;
  line.append(ghost,typed,accessible);summary.append(line);typingTargets.push({element:typed,text:text,row:row});
 }
 const arrow=document.createElement('span');arrow.className='row-arrow';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');
 row.append(button,summary,arrow);rows.append(row);entryButtons.set(entry.id,button);
}
skip.addEventListener('click',finishReplay);
document.querySelector('#record-close').addEventListener('click',function(){closeRecord(true);});
document.querySelector('#record-list').addEventListener('click',function(){closeRecord(true);});
record.addEventListener('cancel',function(event){event.preventDefault();closeRecord(true);});
record.addEventListener('close',releaseRecord);
document.querySelector('#previous-record').addEventListener('click',function(){if(activeIndex>0)openRecord(activeIndex-1,true);});
document.querySelector('#next-record').addEventListener('click',function(){if(activeIndex<LOG_CONFIG.entries.length-1)openRecord(activeIndex+1,true);});
function restoreHash(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch{}const index=LOG_CONFIG.entries.findIndex(function(entry){return entry.id===id;});if(index>=0){if(rows.children[index].hidden)finishReplay();openRecord(index,false);}else if(record.open)closeRecord(false);}
window.addEventListener('popstate',restoreHash);window.addEventListener('hashchange',restoreHash);
if(reduced)finishReplay();else tickReplay();
restoreHash();
</script>
